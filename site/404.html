<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>404 — mask</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2335d0ba'/%3E%3Ctext x='16' y='23' font-size='17' text-anchor='middle' fill='%2306231f' font-family='sans-serif' font-weight='700'%3E%E5%B0%81%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0b0f14; --panel: #111823; --line: #1f2a37;
    --text: #e6edf3; --muted: #93a4b5; --accent: #35d0ba;
    --mono: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: radial-gradient(900px 320px at 70% -10%, rgba(53, 208, 186, 0.10), transparent), var(--bg);
    color: var(--text); font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
    line-height: 1.8; padding: 32px;
  }
  main { max-width: 560px; }
  .code { font-family: var(--mono); font-size: 13px; color: var(--accent); letter-spacing: 0.08em; }
  h1 { font-size: 30px; margin: 8px 0 12px; font-weight: 800; }
  p { color: var(--muted); margin: 0 0 28px; }
  a.btn {
    display: inline-block; font-family: var(--mono); font-size: 14px;
    padding: 12px 20px; border-radius: 10px; text-decoration: none;
    background: var(--accent); color: #06231f; font-weight: 700;
  }
  a.btn:hover { filter: brightness(1.08); }
  .note { margin-top: 28px; font-size: 13px; color: var(--muted); }
  .note a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <div class="code">404 — NOT FOUND</div>
  <h1>このパスには何もありません。</h1>
  <p>
    mask の公開ページは <code>/mask/</code> の下だけです。
    それ以外のパスは、このサイトの管轄外です。
  </p>
  <a class="btn" href="/mask/">mask のページへ戻る</a>
  <div class="note">
    ソースとドキュメント: <a href="https://github.com/yf-1229/mask">github.com/yf-1229/mask</a>
  </div>
</main>
</body>
</html>
