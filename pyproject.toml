[project]
name = "mask"
version = "0.1.0"
description = "PII pseudonymization gateway for local/cloud LLMs — real names never reach the model"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Yuta Fujiwara" }]
keywords = ["pii", "privacy", "llm", "gateway", "pseudonymization", "anonymization", "openai", "anthropic"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pynacl>=1.5",
  "spacy>=3.7,<3.9",
  "ja_ginza>=5.2",
]

[project.urls]
Homepage = "https://branchead.com/mask/"
Repository = "https://github.com/yf-1229/mask"
Issues = "https://github.com/yf-1229/mask/issues"
Security = "https://github.com/yf-1229/mask/security/policy"

[project.scripts]
mask-server = "mask.gateway:main"
mask = "mask.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mask"]

[tool.pytest.ini_options]
testpaths = ["tests"]
