name: Release

# Tag a commit (`git tag v1.0.1 && git push --tags`) and this publishes the
# native binaries: no Python runtime, no OpenSSL, no cmake — one self-contained
# executable per platform.
#
#   mask-<target>        Linux / macOS (chmod +x, drop it on your PATH)
#   mask-<target>.exe    Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            linker: aarch64-linux-gnu-gcc
            apt: gcc-aarch64-linux-gnu
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross linker (linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker || 'gcc' }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage the binary
        shell: bash
        run: |
          set -euo pipefail
          exe=""
          [ "${{ matrix.os }}" = "windows-latest" ] && exe=".exe"
          src="target/${{ matrix.target }}/release/mask${exe}"
          dst="mask-${{ matrix.target }}${exe}"
          cp "$src" "$dst"
          "$dst" --version

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: mask-${{ matrix.target }}
          path: mask-${{ matrix.target }}*
          if-no-files-found: error

  publish:
    name: publish release assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -l dist

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/mask-*
          fail_on_unmatched_files: true
          generate_release_notes: true
