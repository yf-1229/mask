[project]
name = "mask"
version = "0.1.0"
description = "PII pseudonymization harness for local/cloud LLMs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "spacy>=3.7,<3.9",
    "ja_ginza>=5.2",
]

[project.scripts]
mask-server = "mask.gateway:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mask"]

[tool.pytest.ini_options]
testpaths = ["tests"]
