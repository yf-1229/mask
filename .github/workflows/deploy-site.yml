name: Deploy site

# Publishes site/ to https://mask.branchead.com/ as an assets-only Worker on its
# own custom domain. The apex site (branchead.com) belongs to a different Worker
# and is untouched: the subdomain is a separate hostname.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   — Workers Scripts:Edit, Workers Routes:Edit, Zone:Read
#   CLOUDFLARE_ACCOUNT_ID  — the account that owns the branchead.com zone
#
# Without them the job skips instead of failing, so a fork or a fresh clone does
# not show a red X for a deploy it was never able to perform.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    name: wrangler deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice title=Deploy skipped::CLOUDFLARE_API_TOKEN is not set for this repository."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.skip == 'false'
        with:
          node-version: 22

      - name: Deploy
        if: steps.creds.outputs.skip == 'false'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pinned so a Wrangler release cannot change what gets published.
          wranglerVersion: "4.165.0"
          command: deploy
