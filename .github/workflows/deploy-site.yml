name: Deploy site

# Publishes site/ to https://branchead.com/mask/ as an assets-only Worker on a
# path route. The apex site (branchead.com) belongs to a different Worker and is
# untouched: the more specific route pattern wins.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   — Workers Scripts:Edit, Workers Routes:Edit, Zone:Read
#   CLOUDFLARE_ACCOUNT_ID  — the account that owns the branchead.com zone

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    name: wrangler deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # assets.base_path needs Wrangler 4.148.0 or later.
          wranglerVersion: "4.165.0"
          command: deploy
