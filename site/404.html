<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>404 — mask</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230a0a0a'/%3E%3Crect x='9' y='14' width='14' height='4' rx='2' fill='%23fafafa'/%3E%3Ccircle cx='24' cy='8' r='2' fill='%23e7000b'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f5f5f5;
    --paper: #ffffff;
    --ink: #0a0a0a;
    --soft: #2a2a2a;
    --mid: #737373;
    --line: #e3e3e3;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
      "Liberation Mono", monospace;
    --sans: system-ui, -apple-system, "Segoe UI", "Hiragino Sans",
      "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", Meiryo,
      sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.85;
    -webkit-font-smoothing: antialiased;
    padding: 40px 24px;
  }

  h1, p { margin: 0; }
  a { color: inherit; }

  main { width: 100%; max-width: 480px; }

  .brand {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    font-weight: 600;
    text-decoration: none;
  }
  .brand svg { width: 24px; height: 24px; }

  .code {
    margin-top: 36px;
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.06em;
    color: var(--mid);
  }

  h1 {
    margin-top: 10px;
    font-size: 30px;
    line-height: 1.4;
    font-weight: 700;
  }

  p.lede {
    margin-top: 14px;
    color: var(--soft);
    font-size: 16px;
  }

  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 12px 20px;
    margin-top: 32px;
  }

  .btn {
    display: inline-flex;
    padding: 10px 20px;
    border-radius: 999px;
    background: var(--ink);
    color: #fff;
    font-size: 15px;
    text-decoration: none;
  }
  .btn:hover { background: #262626; }

  .link {
    align-self: center;
    font-size: 15px;
    color: var(--mid);
    text-decoration: none;
    border-bottom: 1px solid var(--line);
    padding-bottom: 2px;
  }
  .link:hover { color: var(--ink); border-color: var(--ink); }
</style>
</head>
<body>

<main>
  <a class="brand" href="/" aria-label="mask — トップ">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="9" fill="#0a0a0a"/>
      <rect x="9" y="14" width="14" height="4" rx="2" fill="#fafafa"/>
      <circle cx="24" cy="8" r="2" fill="#e7000b"/>
    </svg>
    mask
  </a>

  <p class="code">404 — NOT FOUND</p>
  <h1>そのページは、ありません。</h1>
  <p class="lede">探しているのは、たぶんトップページにあります。</p>

  <div class="actions">
    <a class="btn" href="/">トップへ戻る</a>
    <a class="link" href="https://github.com/yf-1229/mask" rel="noopener">GitHub ↗</a>
  </div>
</main>

</body>
</html>
